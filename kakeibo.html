<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>家計簿 - 予算管理モジュール</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="budget-container">
    <h2>月間予算管理</h2>

    <!-- 月選択と予算設定 -->
    <div class="control-panel">
      <div class="input-group">
        <label for="month-select">対象月</label>
        <input type="month" id="month-select" value="2026-08">
      </div>
      <div class="input-group">
        <label for="budget-input">今月の予算 (円)</label>
        <input type="number" id="budget-input" value="100000" step="1000">
      </div>
    </div>

    <!-- 収支サマリー表示 -->
    <div class="summary-cards">
      <div class="card">
        <span class="label">今月の予算</span>
        <span class="amount" id="display-budget">¥0</span>
      </div>
      <div class="card">
        <span class="label">今月の支出</span>
        <span class="amount expense" id="display-expense">¥0</span>
      </div>
      <div class="card">
        <span class="label">残額</span>
        <span class="amount" id="display-remaining">¥0</span>
      </div>
    </div>

    <!-- 予算メーター -->
    <div class="meter-section">
      <div class="meter-header">
        <span>予算使用率</span>
        <span id="meter-percentage">0%</span>
      </div>
      <div class="meter-bar-bg">
        <div class="meter-bar-fill" id="meter-fill"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
